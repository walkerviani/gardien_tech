name: Build and Release APK

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Extract version from commit message
        id: version
        run: |
          COMMIT_MSG=$(git log -1 --pretty=%B)
          if [[ $COMMIT_MSG =~ release:([0-9]+\.[0-9]+\.[0-9]+) ]]; then
            VERSION="${BASH_REMATCH[1]}"
            echo "version=$VERSION" >> $GITHUB_OUTPUT
            echo "should_release=true" >> $GITHUB_OUTPUT
          else
            echo "should_release=false" >> $GITHUB_OUTPUT
          fi

      - name: Setup Java
        if: steps.version.outputs.should_release == 'true'
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '11'

      - name: Setup Flutter
        if: steps.version.outputs.should_release == 'true'
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 'latest'

      - name: Get dependencies
        if: steps.version.outputs.should_release == 'true'
        run: flutter pub get

      - name: Build APK
        if: steps.version.outputs.should_release == 'true'
        run: flutter build apk --release

      - name: Create ZIP
        if: steps.version.outputs.should_release == 'true'
        run: |
          mkdir -p release
          cp build/app/outputs/flutter-app.apk release/gardien-tech.apk
          cd release
          zip -r gardien-tech-${{ steps.version.outputs.version }}.zip gardien-tech.apk
          cd ..

      - name: Create Release
        if: steps.version.outputs.should_release == 'true'
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: v${{ steps.version.outputs.version }}
          body: Versão ${{ steps.version.outputs.version }} do Gardien Tech
          files: ./release/gardien-tech-${{ steps.version.outputs.version }}.zip